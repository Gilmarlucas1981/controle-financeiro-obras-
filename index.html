<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obras Financeiro">
<title>Controle Financeiro de Obras</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div><small>GESTÃO DE OBRAS</small><h1>Controle Financeiro</h1></div>
  <button onclick="exportBackup()">Backup</button>
</header>

<main>
<section id="home" class="view active">
  <div class="hero">
    <span>PAINEL FINANCEIRO</span>
    <h2>Obras, equipes e resultado</h2>
    <p>Produção × contrato, custos diários, equipamentos, folha e DRE.</p>
  </div>

  <div class="period">
    <label>Início<input id="filterStart" type="date"></label>
    <label>Fim<input id="filterEnd" type="date"></label>
    <button onclick="renderDashboard()">Atualizar</button>
  </div>

  <div id="kpis" class="kpis"></div>
  <div class="section-title"><h3>Resultado por obra/equipe</h3></div>
  <div id="summaryList"></div>
</section>

<section id="launch" class="view">
  <div class="title"><button onclick="go('home')">‹</button><h2>Lançamentos diários</h2></div>
  <div class="card form">
    <div class="grid2">
      <label>Data<input id="lDate" type="date"></label>
      <label>Obra<select id="lObra" onchange="refreshLaunchDefaults()"></select></label>
      <label>Equipe<select id="lEquipe" onchange="refreshLaunchDefaults()"></select></label>
      <label>Produção<input id="lProd" type="number" step="0.001" value="0"></label>
      <label>Unidade<select id="lUnit" onchange="refreshLaunchDefaults()"><option value="tonelada">tonelada</option><option value="m²">m²</option></select></label>
      <label>Contrato/unidade (R$)<input id="lContract" type="number" step="0.01"></label>
      <label>Combustível (R$)<input id="lFuel" type="number" step="0.01" value="0"></label>
      <label>Pedágio (R$)<input id="lToll" type="number" step="0.01" value="0"></label>
      <label>Manutenção (R$)<input id="lMaint" type="number" step="0.01" value="0"></label>
      <label>Outras despesas (R$)<input id="lOther" type="number" step="0.01" value="0"></label>
    </div>
    <div class="preview" id="launchPreview"></div>
    <button class="primary" onclick="saveLaunch()">Salvar lançamento</button>
  </div>
  <input id="launchSearch" class="search" placeholder="Buscar obra/equipe..." oninput="renderLaunches()">
  <div id="launchList"></div>
</section>

<section id="registers" class="view">
  <div class="title"><button onclick="go('home')">‹</button><h2>Cadastros</h2></div>
  <div class="tabs">
    <button class="active" onclick="regTab('contracts',this)">Obras/Equipes</button>
    <button onclick="regTab('equipment',this)">Equipamentos</button>
    <button onclick="regTab('people',this)">Colaboradores</button>
  </div>

  <div id="regContracts" class="regpane active">
    <div class="card form">
      <h3>Novo contrato</h3>
      <div class="grid2">
        <label>Obra<input id="cObra"></label>
        <label>Equipe<input id="cEquipe"></label>
        <label>Dias trabalhados/mês<input id="cDias" type="number" value="26"></label>
        <label>ISS (%)<input id="cIss" type="number" step="0.01" value="0"></label>
        <label>R$/tonelada<input id="cTon" type="number" step="0.01" value="0"></label>
        <label>R$/m²<input id="cM2" type="number" step="0.01" value="0"></label>
      </div>
      <button class="primary" onclick="addContract()">Salvar contrato</button>
    </div>
    <div id="contractList"></div>
  </div>

  <div id="regEquipment" class="regpane">
    <div class="card form">
      <h3>Novo equipamento</h3>
      <div class="grid2">
        <label>Descrição<input id="eDesc"></label>
        <label>Obra<select id="eObra"></select></label>
        <label>Equipe<select id="eEquipe"></select></label>
        <label>Locação mensal (R$)<input id="eMonthly" type="number" step="0.01"></label>
        <label>Dias/mês<input id="eDays" type="number" value="26"></label>
      </div>
      <button class="primary" onclick="addEquipment()">Salvar equipamento</button>
    </div>
    <div id="equipmentList"></div>
  </div>

  <div id="regPeople" class="regpane">
    <div class="card form">
      <h3>Novo colaborador</h3>
      <div class="grid2">
        <label>Nome<input id="pName"></label>
        <label>Obra<select id="pObra"></select></label>
        <label>Equipe<select id="pEquipe"></select></label>
        <label>Salário mensal (R$)<input id="pSalary" type="number" step="0.01"></label>
        <label>INSS (%)<input id="pInss" type="number" step="0.01" value="0"></label>
        <label>FGTS (%)<input id="pFgts" type="number" step="0.01" value="8"></label>
      </div>
      <button class="primary" onclick="addPerson()">Salvar colaborador</button>
    </div>
    <div id="peopleList"></div>
  </div>
</section>

<section id="dre" class="view">
  <div class="title"><button onclick="go('home')">‹</button><h2>DRE mensal</h2></div>
  <div class="period">
    <label>Início<input id="dreStart" type="date"></label>
    <label>Fim<input id="dreEnd" type="date"></label>
    <button onclick="renderDRE()">Atualizar</button>
  </div>
  <div id="dreContent"></div>
</section>
</main>

<nav>
<button onclick="go('home')">⌂<span>Início</span></button>
<button onclick="go('launch')">🧾<span>Lançamentos</span></button>
<button class="fab" onclick="go('launch')">＋</button>
<button onclick="go('registers')">⚙️<span>Cadastros</span></button>
<button onclick="go('dre')">📊<span>DRE</span></button>
</nav>
